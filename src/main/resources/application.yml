spring:
  application:
    name: fleetManagement

  datasource:
    url: jdbc:postgresql://localhost:5432/fleet-management
    username: postgres
    password: evan098
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  liquibase:
    enabled: false

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:change-me-to-a-strong-secret-key-for-production-2026}
  expiration-ms: 3600000

app:
  cors:
    allowed-origins: "http://localhost:5173"
    allowed-methods: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
    allowed-headers: "*"
    allow-credentials: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
